name: Give Strava Kudos

on:
  schedule:
    - cron: "30 5-23/6 * * *"
  workflow_dispatch:

env:
  STRAVA_EMAIL: ${{ secrets.STRAVA_EMAIL }}
  STRAVA_PASSWORD: ${{ secrets.STRAVA_PASSWORD }}
jobs:
  run-kudos-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Keep this version in sync with requirements.txt and Dockerfile.
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Give kudos
        run: python -u give_kudos.py
