name: Give Strava Kudos

on:
  schedule:
    - cron: "30 5-23/6 * * *"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  run-kudos-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Firefox requires HOME to belong to the container's current user (root).
      HOME: /root
    container:
      # Keep this version in sync with requirements.txt and Dockerfile.
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Test credential handling
        run: python -m unittest discover -s tests -v
      - name: Check Firefox startup without credentials
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.firefox.launch()
              page = browser.new_page()
              page.set_content('<title>Smoke test</title>')
              assert page.title() == 'Smoke test'
              browser.close()
          print('Firefox smoke test passed')
          PY
      - name: Give kudos
        env:
          STRAVA_EMAIL: ${{ secrets.STRAVA_EMAIL }}
          STRAVA_PASSWORD: ${{ secrets.STRAVA_PASSWORD }}
        run: python -u give_kudos.py
